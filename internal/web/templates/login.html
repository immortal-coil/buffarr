{{define "login.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Log in - Buffarr</title>
  <link rel="stylesheet" href="/static/app.css?v={{assetVer}}">
  <script>(function(){try{var t=localStorage.getItem('df-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body>
  <div class="auth">
    <div class="auth-card">
      <div class="auth-head"><img src="/static/logo.png" alt="" width="22" height="22" style="border-radius:5px;vertical-align:middle;margin-right:7px">Buffarr</div>
      <div class="auth-body">
        {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
        <a class="btn btn--primary" href="/auth/steam/login">Log in with Steam</a>
      </div>
    </div>
  </div>
</body>
</html>
{{end}}
