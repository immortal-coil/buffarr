# Primary LAN-client-facing cache vhost (R1, R3, R5, R6, R9). PURGE is
# deliberately not served here -- see 50_purge.conf for the internal-only
# PURGE listener (KTD14).
server {
    listen 80 default_server;

    # Matches internal/config.Config.NginxAccessLogPath, which U4's tailer
    # follows.
    access_log /var/log/nginx/cache-access.log cachelog;

    location /healthz {
        access_log off;
        return 200 'ok';
    }

    include /etc/nginx/http.d/cache.conf.d/90_lancache_heartbeat.conf;
    include /etc/nginx/http.d/cache.conf.d/20_lol.conf;
    include /etc/nginx/http.d/cache.conf.d/21_arenanet_manifest.conf;
    include /etc/nginx/http.d/cache.conf.d/22_wsus_cabs.conf;

    location / {
        # CDN toggle enforcement (R9, KTD3): a Host not in the
        # backend-generated allow-list (40_cdn_allowlist.conf) is rejected
        # even when requested directly by Host header, closing the
        # stale-client-DNS-cache bypass dnsmasq-only enforcement would leave
        # open.
        if ($cdn_gate = 0) {
            return 403;
        }

        include /etc/nginx/http.d/cache.conf.d/10_loop_detection.conf;

        # The proven CDN cache-key / slice / stale / lock pattern (KTD2),
        # ported from the upstream cache project's reference config. Slice
        # size is 4m (not the reference config's 1m): at 1m, a full library
        # produces hundreds of thousands of on-disk files, which is enough
        # file/dnode count to pressure ZFS ARC's metadata budget specifically
        # (dnodes share the same capped region as data). 4m cuts file count
        # ~4x for the same cached bytes. The tradeoff is coarser resume
        # granularity, which barely matters here -- Steam depot chunks are
        # fetched sequentially in full, not randomly seeked. Changing this
        # value requires a full cache wipe: a cache_key's slice size is baked
        # into $slice_range, so mismatched slice sizes for the same key can't
        # coexist on disk.
        slice 4m;
        proxy_cache generic;
        proxy_cache_key $cacheidentifier$uri$slice_range;
        proxy_set_header Range $slice_range;

        proxy_ignore_headers Expires Cache-Control;
        proxy_cache_valid 200 206 365d;
        # Allow caching of 200 but not 301/302 -- the cache key may not
        # include query params and so may not be valid for every client.
        proxy_cache_valid 301 302 0;

        proxy_cache_lock on;
        proxy_cache_lock_age 2m;
        proxy_cache_lock_timeout 1h;
        proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
        proxy_cache_revalidate on;
        proxy_cache_bypass $arg_nocache;

        proxy_max_temp_file_size 40960m;

        # Async disk I/O via thread pool so worker processes don't block on
        # cache reads. Matches the upstream cache reference config and is the
        # main reason cached HITs were ~2x faster on the stock cache setup.
        aio threads;
        # Larger output buffers reduce syscall overhead when sending 4MB slices.
        output_buffers 2 4m;

        proxy_pass http://$proxy_upstream$request_uri;
        proxy_redirect off;
        proxy_ignore_client_abort on;
        proxy_set_header Host $proxy_upstream;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        add_header X-Cache-Status $upstream_cache_status always;
    }
}
