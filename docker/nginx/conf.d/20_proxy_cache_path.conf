# Single shared zone for all CDNs (KTD2). inactive is nginx's time-based
# eviction: a last-access timer (reset on every hit) that removes a slice idle
# longer than this regardless of free space. The Go backend is the primary,
# Lock-aware eviction authority (KTD4) via PURGE (see 50_purge.conf); this timer
# is a separate, Lock-UNAWARE mechanism.
#
# Env-configurable via CACHE_INACTIVE (default 365d). RAISE it (e.g.
# CACHE_INACTIVE=3650d, ~10 years) to effectively disable time-based eviction.
# LOWER it only deliberately: a short value lets nginx silently expire
# cached-but-unaccessed slices on a timer, including monitored/Locked entries,
# with no backend involvement (an R5/KTD4 hazard).
#
# max_size/min_free are likewise env-configurable (CACHE_MAX_SIZE/CACHE_MIN_FREE):
# nginx's own disk-exhaustion safety valve, not an eviction policy.
#
# keys_zone is the in-RAM index of cached slices (CACHE_KEYS_ZONE, default 100m).
# Each ~4 MB slice (slice 4m, see 10_cache.conf) needs one key, and ~8000 keys
# fit per 1 MB of zone, so the zone is an effective cache cap independent of
# disk: 100m ~= 800k keys ~= ~3.2 TB of content, after which nginx LRU-evicts
# keys (forcing re-downloads) even with free disk and max_size headroom. Size
# it to the disk -- ~120m covers a 3.7 TB disk at 4 MB slices; round up for
# headroom. It costs that many MB of shared memory.
proxy_cache_path ${CACHE_ROOT}/cache levels=2:2 keys_zone=generic:${CACHE_KEYS_ZONE} inactive=${CACHE_INACTIVE} max_size=${CACHE_MAX_SIZE} min_free=${CACHE_MIN_FREE} loader_files=1000 loader_sleep=50ms loader_threshold=300ms use_temp_path=off;
