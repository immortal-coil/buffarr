# $cacheidentifier disambiguates the cache key by client (User-Agent) as
# well as Host, because Steam traffic reuses generic CDN hostnames that
# Host alone cannot tell apart from other platforms (KTD2). Ported from
# the upstream cache project's overlay/etc/nginx/conf.d/30_maps.conf.
map "$http_user_agent£££$http_host" $cacheidentifier {
    default $http_host;
    ~Valve\/Steam\ HTTP\ Client\ 1\.0£££.* steam;
}

# Resolver for the dynamic proxy_pass below (proxy_pass http://$host... needs
# a resolver because its target is a variable, resolved per-request rather
# than once at config load). 127.0.0.11 is Docker's embedded DNS server,
# reachable from any container on a user-defined bridge network.
resolver ${UPSTREAM_DNS} ipv6=off valid=30s;

# Some Steam content server assignments use private Valve CDN hostnames
# (e.g. cache1-blv2.valve.org) that don't exist in public DNS. Reroute
# those to a resolvable Steam CDN equivalent -- the cache key is
# $cacheidentifier$uri (host-independent), so content cached via either
# path is shared.
map $host $proxy_upstream {
    default              $host;
    "~*\.valve\.org$"   cache1-lax1.steamcontent.com;
}

# $cdn_gate extends the backend-managed $cdn_enabled allowlist to also
# pass through hostnames that the $proxy_upstream map is already rerouting
# to a legitimate CDN upstream (e.g. valve.org → cache1-lax1.steamcontent.com).
# Without this, the allowlist rejects them before the proxy reroute can run.
map $host $cdn_gate {
    default          $cdn_enabled;
    "~*\.valve\.org$" 1;
}
