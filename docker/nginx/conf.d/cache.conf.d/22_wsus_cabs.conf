# Fix for WSUS authroot cab files: never cache, always pass through live.
# Ported from the upstream cache project's cache.conf.d/22_wsus_cabs.conf.
location ~* (authrootstl\.cab|pinrulesstl\.cab|disallowedcertstl\.cab)$ {
    proxy_cache_bypass 1;
    proxy_no_cache 1;
    proxy_pass http://$host$request_uri;
}
