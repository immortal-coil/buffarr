# LAN-client liveness probe. The /lancache-heartbeat path and the
# X-LanCache-Processed-By header are kept verbatim on purpose: they are the
# de-facto contract LAN game clients and cache tooling already probe for.
location = /lancache-heartbeat {
    add_header X-LanCache-Processed-By $hostname always;
    add_header Access-Control-Expose-Headers '*' always;
    add_header Access-Control-Allow-Origin '*' always;
    return 204;
}
