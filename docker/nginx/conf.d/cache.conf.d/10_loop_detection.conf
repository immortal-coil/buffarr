# Loop protection for CDNs that redirect across hostnames we also proxy
# (e.g. PlayStation). Ported from the upstream cache project's
# sites-available/cache.conf.d/root/10_loop_detection.conf.
if ($http_x_lancache_processed_by = $hostname) {
    return 508;
}
proxy_set_header X-LanCache-Processed-By $hostname;
add_header X-LanCache-Processed-By "$hostname,$http_x_lancache_processed_by" always;
