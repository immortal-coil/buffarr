# Internal-only PURGE listener (KTD14). Not reachable from LAN clients --
# it binds a port distinct from the LAN-facing vhost (10_cache.conf) and is
# not published to the host in docker-compose.yml; only containers on the
# shared compose network can reach it at all. PURGE is rejected outright on
# the LAN-facing listener (no PURGE handling there), so this listener is the
# only path to eviction (KTD4).
#
# Two independent factors gate a PURGE here, neither sufficient alone
# (KTD14): a source-IP allowlist (the compose network's subnet -- container
# IPs are dynamic, so this allows the bridge network rather than a single
# literal address) and a shared-secret header compared independently of
# source IP. ${NGINX_PURGE_SECRET} is substituted by entrypoint.sh.
server {
    listen 8090;

    location / {
        if ($http_x_purge_secret != "${NGINX_PURGE_SECRET}") {
            return 403;
        }

        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        # The purge key intentionally omits $slice_range: the cache vhost's
        # serve-side key is $cacheidentifier$uri$slice_range (per-slice), but
        # a wildcard PURGE (trailing '*' on the URI) needs $uri to be the
        # last component of the *purge* key so the prefix match covers every
        # slice stored under it in one call (KTD2's wildcard-eviction note,
        # verified against the running ngx_cache_purge module -- see U2
        # commit notes). Equal-length non-wildcard purges still work, since
        # an empty $slice_range here matches a request with no Range header.
        proxy_cache_purge generic "$cacheidentifier$uri";
    }
}
