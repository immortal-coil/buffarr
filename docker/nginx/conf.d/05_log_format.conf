# Log format U4's tailer parses: carries $cacheidentifier (CDN
# classification), $upstream_cache_status (HIT/MISS/etc.), and the request
# URI/size/timestamp it needs to identify the owning game and account disk
# usage per cache key. Ported in spirit from the upstream cache project's cachelog format.
log_format cachelog '[$cacheidentifier] $remote_addr - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$upstream_cache_status" "$host"';
