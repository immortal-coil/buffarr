# Includes the backend-generated Host-header allow-list fragment from the
# shared volume (KTD7) -- the file internal/nginx.WriteAllowlist atomically
# writes to and the in-container watcher (entrypoint.sh) reloads nginx on
# change. The path is fixed (not envsubst'd) because it must match
# internal/config.Config.NginxAllowlistPath exactly; both sides hardcode the
# same /shared/nginx/40_cdn_allowlist.conf contract.
#
# This directory does not exist in the image -- entrypoint.sh seeds it with
# a permissive bootstrap fragment (default 1: every Host is "enabled") if
# the backend hasn't written a real one yet, so nginx can start and serve
# traffic standalone even before the backend's first boot (see the plan's
# "backend-down blast radius is graceful" property). The backend overwrites
# this same path with a real default-0/allow-list fragment once it is up;
# from that point on, disabling a CDN takes effect via this include.
include /shared/nginx/40_cdn_allowlist.conf;
