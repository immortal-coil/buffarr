# UPSTREAM_DNS must be a real resolver, not the LAN cache's DNS. If the
# cache box's own DNS resolves CDN hostnames back to itself, proxy_pass
# would loop. Same constraint as the former lancachenet/sniproxy service.
server {
    listen 443;
    ssl_preread on;
    resolver ${UPSTREAM_DNS} valid=30s;
    proxy_pass $ssl_preread_server_name:443;
}
