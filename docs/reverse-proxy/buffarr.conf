# Buffarr -- external nginx reverse-proxy site config (drop-in reference).
#
# Copy into your proxy's config and adjust server_name, $backend, and the TLS
# certificate paths.
#
# NOTE: $backend is https://...:9443, not http://...:9080 like the other
# services. The backend derives the Steam OpenID return_to/realm and the session
# cookie's Secure flag from whether the connection it receives is TLS (Go r.TLS);
# it does NOT read X-Forwarded-Proto. Over http:9080 it builds http:// return
# URLs + a non-Secure cookie and Steam login fails. Proxying over TLS to the
# self-signed :9443 (hence proxy_ssl_verify off) makes r.TLS non-nil and the app
# resolves everything to https://<host>/...  Forwarding Host unchanged keeps the
# Steam return_to pointing at the name the browser used.

server {
    set $backend https://<backend-ip>:9443;
    server_name buffarr.example.com;
    listen 443 ssl;
    http2 on;

    ssl_certificate     /path/to/fullchain.pem;        # your public TLS cert
    ssl_certificate_key /path/to/privkey.pem;

    location / {
        proxy_pass $backend;
        proxy_ssl_verify off;                          # backend cert is self-signed
        proxy_set_header Host $host;                    # keeps Steam return_to correct
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
